<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Comunicado de Aula - Portal Tutoría - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar del Docente / Tutor -->
    <div th:replace="~{fragments/profesor_nav :: navbar('comunicados')}"></div>

    <div class="container py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                        <a th:href="@{/profesor/comunicados}" class="btn btn-outline-secondary btn-sm rounded-circle p-2" title="Volver">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-megaphone-fill text-danger me-2"></i>Emitir Comunicado Oficial</h4>
                            <p class="text-muted small mb-0">Se enviará una copia inmediata al correo de los padres y apoderados correspondientes.</p>
                        </div>
                    </div>

                    <form th:action="@{/profesor/comunicados/guardar}" method="post" enctype="multipart/form-data">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="prioridad" class="form-label fw-semibold">Nivel de Prioridad <span class="text-danger">*</span></label>
                                <select class="form-select fw-bold" id="prioridad" name="prioridad" required>
                                    <option value="NORMAL" class="text-dark">Normal / Informativo</option>
                                    <option value="URGENTE" class="text-danger">🚨 URGENTE (Genera Alerta Prioritaria)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="gradoId" class="form-label fw-semibold">Grado Escolar (Opcional si es general)</label>
                                <select class="form-select" id="gradoId" name="gradoId">
                                    <option value="">A todos los grados (General)...</option>
                                    <option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nombre + ' (' + g.nivel.codigo + ')'}">1° Primaria</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="seccionId" class="form-label fw-semibold">Sección Específica</label>
                                <select class="form-select" id="seccionId" name="seccionId">
                                    <option value="">Todas las secciones del grado...</option>
                                    <option th:each="s : ${secciones}" th:value="${s.id}" th:text="${'Aula ' + s.nombre + ' - ' + s.grado.nombre}">Aula A</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="titulo" class="form-label fw-semibold">Título del Comunicado <span class="text-danger">*</span></label>
                                <input type="text" class="form-control fw-bold" id="titulo" name="titulo" placeholder="Ej. Reunión de Padres / Entrega de Boletas" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label fw-semibold">Contenido del Comunicado <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Redacte el texto oficial del comunicado, horarios, pautas y motivos de la citación..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="archivoAdjunto" class="form-label fw-semibold">
                                <i class="bi bi-paperclip text-danger me-1"></i> Adjuntar Documento o Imagen (Opcional):
                            </label>
                            <input type="file" class="form-control" id="archivoAdjunto" name="archivoAdjunto" accept="image/*,.pdf,.doc,.docx">
                            <div class="form-text small">Citaciones oficiales firmadas en PDF, circulares o imágenes informativas.</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a th:href="@{/profesor/comunicados}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                            <button type="submit" class="btn btn-warning rounded-pill px-4 fw-bold text-dark shadow-sm">
                                <i class="bi bi-send-fill me-1"></i> Publicar y Notificar a Padres
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
