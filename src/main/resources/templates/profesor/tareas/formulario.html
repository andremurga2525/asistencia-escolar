<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Tarea Escolar - Portal Docente - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar del Docente / Tutor -->
    <div th:replace="~{fragments/profesor_nav :: navbar('tareas')}"></div>

    <div class="container py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                        <a th:href="@{/profesor/tareas}" class="btn btn-outline-secondary btn-sm rounded-circle p-2" title="Volver">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-file-earmark-plus-fill text-danger me-2"></i>Asignar Nueva Tarea Escolar</h4>
                            <p class="text-muted small mb-0">Los apoderados de la sección recibirán una copia y notificación en su portal y correo electrónico.</p>
                        </div>
                    </div>

                    <form th:action="@{/profesor/tareas/guardar}" method="post" enctype="multipart/form-data" class="needs-validation">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="materia" class="form-label fw-semibold">Curso / Materia <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="materia" name="materia" placeholder="Ej. Matemáticas, Comunicación, Ciencias..." required>
                            </div>

                            <div class="col-md-6">
                                <label for="fechaEntregaStr" class="form-label fw-semibold">Fecha Límite de Entrega <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="fechaEntregaStr" name="fechaEntregaStr" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="gradoId" class="form-label fw-semibold">Grado Escolar <span class="text-danger">*</span></label>
                                <select class="form-select" id="gradoId" name="gradoId" required>
                                    <option value="">Seleccione el grado...</option>
                                    <option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nombre + ' (' + g.nivel.codigo + ')'}">1° Primaria</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="seccionId" class="form-label fw-semibold">Sección / Aula <span class="text-danger">*</span></label>
                                <select class="form-select" id="seccionId" name="seccionId" required>
                                    <option value="">Seleccione la sección...</option>
                                    <option th:each="s : ${secciones}" th:value="${s.id}" th:text="${'Aula ' + s.nombre + ' - ' + s.grado.nombre}">Aula A - 1° Primaria</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-semibold">Título de la Tarea <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ej. Ficha N° 4 - Operaciones Combinadas" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-semibold">Descripción e Instrucciones de Trabajo</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" placeholder="Indique detalladamente qué deben realizar los alumnos, páginas de libros o pautas de entrega..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="archivoAdjunto" class="form-label fw-semibold">
                                <i class="bi bi-paperclip text-danger me-1"></i> Adjuntar Ficha, Documento o Foto (Opcional):
                            </label>
                            <input type="file" class="form-control" id="archivoAdjunto" name="archivoAdjunto" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
                            <div class="form-text small">Puede subir una imagen de la pizarra/ficha (PNG, JPG) o un documento (PDF, Word) para que los padres puedan descargarlo.</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a th:href="@{/profesor/tareas}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm" style="background-color: #b91c1c;">
                                <i class="bi bi-send-check me-1"></i> Publicar y Notificar a Padres
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
