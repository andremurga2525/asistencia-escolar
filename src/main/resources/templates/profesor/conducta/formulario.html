<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Reporte de Conducta - Portal Tutoría - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar del Docente / Tutor -->
    <div th:replace="~{fragments/profesor_nav :: navbar('conducta')}"></div>

    <div class="container py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                        <a th:href="@{/profesor/conducta}" class="btn btn-outline-secondary btn-sm rounded-circle p-2" title="Volver">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-shield-exclamation text-danger me-2"></i>Registrar Reporte de Conducta</h4>
                            <p class="text-muted small mb-0">El apoderado del estudiante recibirá una copia automática en su correo electrónico y en su portal escolar.</p>
                        </div>
                    </div>

                    <form th:action="@{/profesor/conducta/guardar}" method="post">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="estudianteId" class="form-label fw-semibold">Estudiante Involucrado <span class="text-danger">*</span></label>
                                <select class="form-select" id="estudianteId" name="estudianteId" required>
                                    <option value="">Seleccione al estudiante...</option>
                                    <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.nombreCompleto + ' (DNI: ' + e.dni + ')'}">Lucas Quispe (DNI: 71234567)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="tipoFalta" class="form-label fw-semibold">Tipo de Reporte / Falta <span class="text-danger">*</span></label>
                                <select class="form-select fw-semibold" id="tipoFalta" name="tipoFalta" required>
                                    <option value="LLAMADA_ATENCION">⚠️ Llamada de Atención Verbal / Falta Leve</option>
                                    <option value="FALTA_GRAVE">🚨 Falta Grave / Indisciplina</option>
                                    <option value="CITACION_APODERADO">📅 Citación Presencial de Apoderado</option>
                                    <option value="FELICITACION">⭐ Reconocimiento / Felicitación de Conducta</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-semibold">Motivo / Título de la Incidencia <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ej. Distracción reiterada en clase / Olvido de tareas / Desobediencia" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-semibold">Descripción Detallada de los Hechos <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" placeholder="Explique qué sucedió durante la clase o recreo, fecha, hora y contexto..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="medidasTomadas" class="form-label fw-semibold">Medidas Tomadas / Compromiso Acordado</label>
                            <textarea class="form-control" id="medidasTomadas" name="medidasTomadas" rows="2" placeholder="Ej. Diálogo reflexivo con el estudiante, firma de compromiso pedagógico..."></textarea>
                        </div>

                        <div class="card p-3 rounded-4 bg-light border mb-4">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="requiereCitacionBool" name="requiereCitacionBool" value="true" onchange="toggleCitacion(this)">
                                <label class="form-check-label fw-bold text-dark" for="requiereCitacionBool">
                                    ¿Requiere citar presencialmente al padre o madre de familia al colegio?
                                </label>
                            </div>

                            <div id="campoFechaCitacion" style="display: none;" class="mt-2">
                                <label for="fechaCitacionStr" class="form-label small fw-semibold text-danger">Fecha y Hora Programada para la Citación Presencial:</label>
                                <input type="datetime-local" class="form-control" id="fechaCitacionStr" name="fechaCitacionStr">
                                <div class="form-text small">Se notificará formalmente al padre con fecha y hora exacta para acudir a la institución.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a th:href="@{/profesor/conducta}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm" style="background-color: #b91c1c;">
                                <i class="bi bi-shield-fill-check me-1"></i> Registrar y Notificar al Apoderado
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleCitacion(checkbox) {
            const campo = document.getElementById('campoFechaCitacion');
            if (checkbox.checked) {
                campo.style.display = 'block';
            } else {
                campo.style.display = 'none';
            }
        }
    </script>
</body>
</html>
