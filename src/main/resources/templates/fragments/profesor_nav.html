<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Navbar Superior y Menú para Docentes y Tutores -->
    <div th:fragment="navbar(activeTab)">
        <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top" style="background-color: #b91c1c;">
            <div class="container-fluid px-3 px-sm-4">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/profesor/dashboard}">
                    <div class="rounded-3 d-flex align-items-center justify-content-center p-1 bg-white shadow-sm flex-shrink-0" style="width: 36px; height: 36px;">
                        <img th:src="@{/logo-colegio}" alt="Logo" style="max-height: 28px; max-width: 30px; object-fit: contain;">
                    </div>
                    <div class="lh-1">
                        <span class="fs-6 text-white fw-bold d-none d-sm-inline" th:text="${colegio != null ? colegio.nombreColegio : 'I.E.P. Internacional Jeshua'}">I.E.P. Internacional Jeshua</span>
                        <span class="fs-6 text-white fw-bold d-inline d-sm-none">I.E.P. Jeshua</span>
                        <span class="badge bg-white text-danger ms-1 small rounded-pill" style="font-size: 0.65rem;">Docentes y Tutores</span>
                    </div>
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navProfesor">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navProfesor">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 mt-2 mt-lg-0">
                        <li class="nav-item">
                            <a class="nav-link px-3 rounded-pill text-white" th:classappend="${activeTab == 'dashboard' ? 'active bg-white text-danger fw-bold shadow-sm' : ''}" th:href="@{/profesor/dashboard}">
                                <i class="bi bi-speedometer2 me-1"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 rounded-pill text-white" th:classappend="${activeTab == 'tareas' ? 'active bg-white text-danger fw-bold shadow-sm' : ''}" th:href="@{/profesor/tareas}">
                                <i class="bi bi-journal-bookmark-fill me-1"></i> Tareas Escolares
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 rounded-pill text-white" th:classappend="${activeTab == 'comunicados' ? 'active bg-white text-danger fw-bold shadow-sm' : ''}" th:href="@{/profesor/comunicados}">
                                <i class="bi bi-megaphone-fill me-1"></i> Comunicados de Aula
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 rounded-pill text-white" th:classappend="${activeTab == 'conducta' ? 'active bg-white text-danger fw-bold shadow-sm' : ''}" th:href="@{/profesor/conducta}">
                                <i class="bi bi-shield-exclamation me-1"></i> Reportes de Conducta
                            </a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
                        <span class="text-white small d-none d-md-inline">
                            <i class="bi bi-person-circle me-1"></i> <strong sec:authentication="name">Docente</strong>
                        </span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3 shadow-sm">
                                <i class="bi bi-box-arrow-right me-1"></i> Salir
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </div>

</body>
</html>
