<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion ? 'Editar Estudiante' : 'Nuevo Estudiante'} + ' - I.E.P. Internacional Jeshua'">Estudiante - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .bg-jeshua { background-color: #b91c1c !important; }
        .text-jeshua { color: #b91c1c !important; }
        .btn-jeshua { background-color: #b91c1c; color: white; }
        .btn-jeshua:hover { background-color: #991b1b; color: white; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar compartido -->
    <div th:replace="~{fragments/admin_nav :: navbar('estudiantes')}"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h4 class="fw-bold mb-1 text-dark">
                                    <i class="bi bi-person-badge text-jeshua me-2"></i>
                                    <span th:text="${esEdicion ? 'Editar Datos del Estudiante' : 'Registro de Nuevo Estudiante'}"></span>
                                </h4>
                                <p class="text-muted small mb-0">
                                    Complete los datos personales y asigne el grado, sección y turno escolar.
                                </p>
                            </div>
                            <a th:href="@{/admin/estudiantes}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                                <i class="bi bi-arrow-left me-1"></i> Volver al listado
                            </a>
                        </div>
                        <hr class="mt-3 mb-0">
                    </div>

                    <div class="card-body p-4">
                        <form th:action="${esEdicion ? '/admin/estudiantes/' + estudiante.id + '/actualizar' : '/admin/estudiantes/guardar'}" 
                              th:object="${estudiante}" 
                              method="post">

                            <h5 class="fw-bold text-secondary mb-3 fs-6 text-uppercase">1. Datos Personales</h5>
                            <div class="row g-3 mb-4">
                                <!-- DNI -->
                                <div class="col-md-4">
                                    <label for="dni" class="form-label fw-semibold">DNI (8 dígitos) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="dni" th:field="*{dni}" 
                                           maxlength="8" pattern="[0-9]{8}" placeholder="Ej: 71234567" 
                                           th:readonly="${esEdicion}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                                </div>

                                <!-- Nombres -->
                                <div class="col-md-4">
                                    <label for="nombres" class="form-label fw-semibold">Nombres <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombres" th:field="*{nombres}" 
                                           placeholder="Ej: Lucas Gabriel" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
                                </div>

                                <!-- Apellidos -->
                                <div class="col-md-4">
                                    <label for="apellidos" class="form-label fw-semibold">Apellidos <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="apellidos" th:field="*{apellidos}" 
                                           placeholder="Ej: Quispe Mendoza" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                                </div>

                                <!-- Género -->
                                <div class="col-md-4">
                                    <label for="genero" class="form-label fw-semibold">Género <span class="text-danger">*</span></label>
                                    <select class="form-select" id="genero" th:field="*{genero}" required>
                                        <option value="">Seleccione...</option>
                                        <option value="M">Masculino (M)</option>
                                        <option value="F">Femenino (F)</option>
                                    </select>
                                </div>

                                <!-- Fecha de Nacimiento -->
                                <div class="col-md-4">
                                    <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
                                    <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}">
                                </div>

                                <!-- Dirección -->
                                <div class="col-md-4">
                                    <label for="direccion" class="form-label fw-semibold">Dirección / Residencia</label>
                                    <input type="text" class="form-control" id="direccion" th:field="*{direccion}" 
                                           placeholder="Ej: Calle San Martín 145, Tumán">
                                </div>
                            </div>

                            <h5 class="fw-bold text-secondary mb-3 fs-6 text-uppercase">2. Asignación Académica (Matrícula)</h5>
                            <div class="row g-3 mb-4">
                                <!-- Sección / Grado -->
                                <div class="col-md-6">
                                    <label for="seccionId" class="form-label fw-semibold">Nivel, Grado y Sección <span class="text-danger">*</span></label>
                                    <select class="form-select" id="seccionId" name="seccionId" required>
                                        <option value="">Seleccione Sección...</option>
                                        <option th:each="sec : ${secciones}" 
                                                th:value="${sec.id}" 
                                                th:text="${sec.grado.nivel.nombre + ' - ' + sec.grado.nombre + ' (' + sec.nombre + ')'}"
                                                th:selected="${seccionSeleccionada != null and seccionSeleccionada == sec.id}">
                                            Primaria - 1° Grado (A)
                                        </option>
                                    </select>
                                </div>

                                <!-- Turno -->
                                <div class="col-md-6">
                                    <label for="turnoId" class="form-label fw-semibold">Turno Escolar <span class="text-danger">*</span></label>
                                    <select class="form-select" id="turnoId" name="turnoId" required>
                                        <option value="">Seleccione Turno...</option>
                                        <option th:each="t : ${turnos}" 
                                                th:value="${t.id}" 
                                                th:text="${t.nombre}"
                                                th:selected="${turnoSeleccionado != null and turnoSeleccionado == t.id}">
                                            Mañana
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <h5 class="fw-bold text-secondary mb-3 fs-6 text-uppercase">3. Estado y Credencial</h5>
                            <div class="row g-3 mb-4 align-items-center">
                                <div class="col-md-6" th:if="${esEdicion}">
                                    <label class="form-label fw-semibold">Código QR Asignado:</label>
                                    <div>
                                        <span class="badge bg-dark font-monospace fs-6 px-3 py-2" th:text="${estudiante.codigoQr}">JESHUA-XXXXXXXX</span>
                                        <small class="text-muted d-block mt-1">Este identificador se utiliza para el escaneo seguro en puerta.</small>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check form-switch pt-2">
                                        <input class="form-check-input" type="checkbox" role="switch" id="activo" th:field="*{activo}">
                                        <label class="form-check-label fw-semibold" for="activo">Estudiante Activo en el Sistema</label>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/estudiantes}" class="btn btn-light border px-4">Cancelar</a>
                                <button type="submit" class="btn btn-jeshua fw-semibold px-4">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${esEdicion ? 'Actualizar Estudiante' : 'Guardar y Generar QR'}"></span>
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
