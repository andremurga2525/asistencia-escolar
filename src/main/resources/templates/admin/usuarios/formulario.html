<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion ? 'Editar Usuario' : 'Nuevo Usuario'} + ' - I.E.P. Internacional Jeshua'">Usuario - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .bg-jeshua { background-color: #b91c1c !important; }
        .text-jeshua { color: #b91c1c !important; }
        .btn-jeshua { background-color: #b91c1c; color: white; }
        .btn-jeshua:hover { background-color: #991b1b; color: white; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar compartido -->
    <div th:replace="~{fragments/admin_nav :: navbar('usuarios')}"></div>

    <div class="container py-4">

        <!-- Mensajes Flash -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h4 class="fw-bold mb-1 text-dark">
                                    <i class="bi bi-person-badge-fill text-jeshua me-2"></i>
                                    <span th:text="${esEdicion ? 'Editar Datos del Usuario' : 'Registro de Nuevo Personal'}"></span>
                                </h4>
                                <p class="text-muted small mb-0">
                                    Gestione las credenciales y los niveles de autorización en Spring Security.
                                </p>
                            </div>
                            <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                                <i class="bi bi-arrow-left me-1"></i> Volver a Usuarios
                            </a>
                        </div>
                        <hr class="mt-3 mb-0">
                    </div>

                    <div class="card-body p-4">
                        <form th:action="${esEdicion ? '/admin/usuarios/' + usuario.id + '/actualizar' : '/admin/usuarios/guardar'}" 
                              th:object="${usuario}" 
                              method="post">

                            <h5 class="fw-bold text-secondary mb-3 fs-6 text-uppercase">1. Datos de Identificación</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="username" class="form-label fw-semibold">Nombre de Usuario (Login) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" 
                                           placeholder="Ej: auxiliar2" th:readonly="${esEdicion}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="nombreCompleto" class="form-label fw-semibold">Nombre y Apellidos Completos <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" 
                                           placeholder="Ej: Carlos Mendoza Ruiz" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" 
                                           placeholder="Ej: auxiliar2@internacionaljeshua.edu.pe" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono Celular</label>
                                    <input type="text" class="form-control" id="telefono" th:field="*{telefono}" 
                                           placeholder="Ej: +51 974 333 444">
                                </div>

                                <div class="col-md-6" th:if="${!esEdicion}">
                                    <label for="password" class="form-label fw-semibold">Contraseña de Acceso <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" 
                                           placeholder="Mínimo 6 caracteres..." required minlength="6">
                                </div>

                                <div class="col-md-6">
                                    <div class="form-check form-switch pt-4">
                                        <input class="form-check-input" type="checkbox" role="switch" id="activo" th:field="*{activo}">
                                        <label class="form-check-label fw-semibold" for="activo">Usuario Habilitado para Ingresar</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="fw-bold text-secondary mb-3 fs-6 text-uppercase">2. Roles y Privilegios</h5>
                            <div class="border rounded-3 p-3 bg-light mb-4">
                                <div th:each="r : ${rolesDisponibles}" class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" name="rolesIds" 
                                           th:value="${r.id}" th:id="'rol_' + ${r.id}"
                                           th:checked="${usuario.roles != null and usuario.roles.contains(r)}">
                                    <label class="form-check-label" th:for="'rol_' + ${r.id}">
                                        <strong th:text="${r.nombre.name()}">ROLE_AUXILIAR</strong> — 
                                        <span class="text-muted small" th:text="${r.descripcion}">Permiso de escaneo y puerta</span>
                                    </label>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/usuarios}" class="btn btn-light border px-4">Cancelar</a>
                                <button type="submit" class="btn btn-jeshua fw-semibold px-4">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${esEdicion ? 'Actualizar Usuario' : 'Crear Usuario'}"></span>
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Formulario de Cambio de Contraseña (Solo en Modo Edición) -->
                <div th:if="${esEdicion}" class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-dark mb-2">
                            <i class="bi bi-key-fill text-warning me-2"></i> Restablecer Contraseña de este Usuario
                        </h5>
                        <p class="text-muted small mb-3">Actualice la contraseña cifrada con BCrypt para este personal escolar:</p>
                        <form th:action="@{/admin/usuarios/{id}/reset-password(id=${usuario.id})}" method="post">
                            <div class="input-group">
                                <input type="password" name="nuevaPassword" class="form-control" 
                                       placeholder="Escriba la nueva contraseña (mínimo 6 caracteres)..." required minlength="6">
                                <button class="btn btn-warning fw-bold text-dark px-4" type="submit">
                                    <i class="bi bi-shield-check me-1"></i> Cambiar Contraseña
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
