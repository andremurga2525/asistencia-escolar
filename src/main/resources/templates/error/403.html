<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido (403) - I.E.P. Internacional Jeshua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-5">
                    <div class="text-danger mb-3">
                        <i class="bi bi-shield-lock-fill display-1"></i>
                    </div>
                    <h2 class="fw-bold text-dark mb-2">Acceso Restringido</h2>
                    <p class="text-muted mb-4">
                        Su cuenta actual no cuenta con los permisos necesarios para acceder a este módulo. Cada rol en 
                        <strong class="text-danger" th:text="${colegio.nombreColegio}">I.E.P. Internacional Jeshua</strong> cuenta con accesos estrictamente delimitados.
                    </p>

                    <div class="d-flex justify-content-center gap-2">
                        <a sec:authorize="hasRole('ADMIN')" href="/admin/dashboard" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-speedometer2 me-1"></i> Ir a mi Dashboard
                        </a>
                        <a sec:authorize="hasRole('AUXILIAR')" href="/auxiliar/escaner" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-qr-code-scan me-1"></i> Ir a mi Escáner
                        </a>
                        <a sec:authorize="hasRole('PADRE')" href="/padre/hijos" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-person-heart me-1"></i> Ir a Mis Hijos
                        </a>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
