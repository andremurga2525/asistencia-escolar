server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: asistencia-escolar

  # Motor de plantillas Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  # Conexión oficial a MySQL 8.4 LTS en el puerto 3307 (sin interferir con XAMPP en 3306)
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/asistencia_escolar?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: asistencia_user
    password: Asistencia2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # Configuración JPA / Hibernate para MySQL 8.4
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
